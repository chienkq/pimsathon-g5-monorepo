services:
  postgres:
    # pgvector/pgvector:pg16 is plain postgres:16 + the pgvector extension binary — same data
    # format, so it's a drop-in swap for the existing volume (needed for Code Search's vector index,
    # migration 0017 runs `CREATE EXTENSION vector`).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports:
      - "5432:5432"
    volumes:
      - workflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workflow_postgres_data:
